name: Prune stale branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prune-branches.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete helper branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            add-3x-ui
            add-ai-telephony-demo
            add-faster-whisper
            add-handy
            add-prism-desktop
            add-repositories-2026-08-21
            bootstrap-catalog
            github-polish
            repo-cleanup-2026-08-24
          )

          for branch in "${branches[@]}"; do
            echo "Deleting ${branch}"
            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" \
              || true
          done
