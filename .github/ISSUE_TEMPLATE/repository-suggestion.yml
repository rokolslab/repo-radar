name: Repository suggestion
description: Предложить GitHub-репозиторий для анализа и добавления в Repo Radar
title: "[Repository]: "
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за предложение. Repo Radar оценивает практическую применимость проектов, а не только их популярность.

  - type: input
    id: repository
    attributes:
      label: Repository URL
      description: Прямая ссылка на GitHub-репозиторий.
      placeholder: https://github.com/owner/repository
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Почему стоит рассмотреть
      description: Какую проблему решает проект или чем он отличается от уже известных инструментов?
    validations:
      required: true

  - type: input
    id: category
    attributes:
      label: Предполагаемая категория
      description: Если не уверены, оставьте пустым.
      placeholder: agent-skills, infrastructure, utilities, ...

  - type: textarea
    id: use-case
    attributes:
      label: Возможный сценарий использования
      description: Где и для какой задачи этот проект может быть полезен?

  - type: checkboxes
    id: checks
    attributes:
      label: Проверка
      options:
        - label: Я проверил, что этого репозитория ещё нет в корневом README Repo Radar.
          required: true
